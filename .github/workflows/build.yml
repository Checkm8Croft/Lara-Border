name: Build and Release Border

on:
  push:
    branches:
      - main  # Change to 'master' if your main branch is named master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # Required to delete/create tags and releases

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: 'stable'

      - name: Compile Launcher
        run: nim c -d:release launcher.nim

      - name: Clean up old 'border' tag and release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          # Configure Git bot identity
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 1. Delete the GitHub release associated with the 'border' tag if it exists
          gh release delete border --yes --cleanup-tag 2>$null || echo "No previous release found."

          # 2. Delete the remote 'border' tag if it exists
          git push origin --delete border 2>$null || echo "No previous remote tag found."

          # 3. Delete the local 'border' tag if it exists
          git tag -d border 2>$null || echo "No previous local tag found."

      - name: Create and push fresh 'border' tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          # Create a fresh 'border' tag pointing to the latest commit
          git tag border
          git push origin border

      - name: Publish/Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: 'border'
          name: 'Tomb Raider Borderless Launcher (Border)'
          body: 'Automatic continuous build of the universal Tomb Raider custom level launcher.'
          files: |
            launcher.exe
            TR-borderless.sdb
          draft: false
          prerelease: false
